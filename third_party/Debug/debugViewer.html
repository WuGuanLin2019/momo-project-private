<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Momo Agent - 上下文调试器</title>
<style>
  :root {
    --bg: #16181d;
    --bg-elev: #1d2027;
    --bg-hover: #242831;
    --border: #2e323b;
    --text: #d8dae0;
    --text-dim: #868b96;
    --accent: #5b9dff;
    --user: #4a9eff;
    --ai: #4ec9a0;
    --tool: #e0a33e;
    --system: #a97bff;
    --think: #6ea8fe;
    --danger: #f0616d;
    --mono: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.55 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
  }

  header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 16px;
    background: var(--bg-elev);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .title { font-weight: 600; letter-spacing: .3px; }
  .status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); transition: background .2s; }
  .dot.on { background: #3ec97a; box-shadow: 0 0 8px rgba(62,201,122,.6); }
  .spacer { flex: 1 1 auto; }

  select, button {
    background: var(--bg-hover);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 10px;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  button:hover, select:hover { border-color: #454b58; }
  .meta { font-size: 12px; color: var(--text-dim); font-family: var(--mono); }
  label.toggle { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-dim); cursor: pointer; }

  main { flex: 1 1 auto; overflow-y: auto; padding: 16px; }
  .empty { color: var(--text-dim); text-align: center; margin-top: 15vh; font-size: 13px; }

  .msg { display: flex; gap: 10px; margin-bottom: 14px; }
  .badge {
    flex: 0 0 auto;
    width: 58px;
    text-align: right;
    font: 600 11px/1.7 var(--mono);
    color: var(--text-dim);
    user-select: none;
  }
  .bubble {
    flex: 1 1 auto;
    min-width: 0;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-left: 3px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
  }
  .msg.user    .bubble { border-left-color: var(--user); }
  .msg.ai      .bubble { border-left-color: var(--ai); }
  .msg.tool    .bubble { border-left-color: var(--tool); }
  .msg.system  .bubble { border-left-color: var(--system); }
  .msg.user    .badge  { color: var(--user); }
  .msg.ai      .badge  { color: var(--ai); }
  .msg.tool    .badge  { color: var(--tool); }
  .msg.system  .badge  { color: var(--system); }

  /* 思考过程：默认折叠，避免盖过正文 */
  .think > summary { color: var(--think); }
  .think pre { max-height: 30vh; overflow: auto; }

  /* system prompt 通常很长，默认折叠，避免淹没下方的消息流 */
  .sysbox {
    margin-bottom: 14px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-left: 3px solid var(--system);
    border-radius: 8px;
    padding: 9px 12px;
  }
  .sysbox > summary { color: var(--system); }
  .sysbox > summary:hover { color: var(--accent); }
  .sysbox pre { max-height: 40vh; overflow: auto; }

  .content { white-space: pre-wrap; word-break: break-word; }
  .content:empty::before { content: "(空)"; color: var(--text-dim); }

  details { margin-top: 8px; }
  details > summary {
    cursor: pointer;
    font-size: 11px;
    color: var(--text-dim);
    font-family: var(--mono);
    list-style: none;
  }
  details > summary::before { content: "▸ "; }
  details[open] > summary::before { content: "▾ "; }
  details > summary:hover { color: var(--accent); }
  pre {
    margin: 6px 0 0;
    padding: 8px 10px;
    background: #12141a;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow-x: auto;
    font: 12px/1.5 var(--mono);
    color: #b6bac4;
    white-space: pre-wrap;
    word-break: break-all;
  }

  footer {
    flex: 0 0 auto;
    padding: 6px 16px;
    background: var(--bg-elev);
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-dim);
    font-family: var(--mono);
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
</style>
</head>
<body>

<header>
  <span class="title">Momo 上下文调试器</span>
  <span class="status"><span class="dot" id="dot"></span><span id="statusText">未连接</span></span>

  <select id="agentSelect" title="切换要查看的 agent">
    <option value="momo">momo</option>
  </select>
  <button id="refreshBtn" title="立即拉取一次当前上下文">刷新</button>
  <button id="saveDirBtn" title="选择保存目录（Chrome/Edge），之后每轮可直接落盘">保存到目录…</button>
  <button id="saveNowBtn" title="把当前这一帧上下文立刻存成 txt">保存当前</button>

  <span class="spacer"></span>

  <span class="meta" id="metaText">—</span>
  <label class="toggle"><input type="checkbox" id="autoSave" title="每收到一轮新上下文就自动存一个 txt">自动保存</label>
  <label class="toggle"><input type="checkbox" id="autoScroll" checked>自动滚动</label>
</header>

<main id="list">
  <div class="empty">等待后端推送上下文…<br>请确认 Python 端已调用 DebugSender.start_debug_sender()</div>
</main>

<footer>
  <span id="footThread">thread: —</span>
  <span id="footTime">更新于: —</span>
  <span id="footSave">保存: 未选择目录</span>
  <span>ws://127.0.0.1:5050/ws</span>
</footer>

<script src="debugViewer.js"></script>
</body>
</html>
